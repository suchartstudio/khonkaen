<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการสถานที่ (Edit/Delete)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 relative">

    <div class="max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">📋 จัดการข้อมูลสถานที่</h2>
            <a href="admin.html" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-900">+ เพิ่มใหม่</a>
        </div>

        <!-- รายการสถานที่ (List View) -->
        <div id="placesList" class="space-y-3">
            <div class="text-center text-gray-500 py-8">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <!-- Modal หน้าต่างแก้ไขข้อมูล (ซ่อนไว้เป็นค่าเริ่มต้น) -->
    <div id="editModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-xl shadow-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">✏️ แก้ไขสถานที่</h3>
                <button type="button" onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>

            <form id="editForm" class="space-y-4">
                <input type="hidden" id="editId">
                <input type="hidden" id="oldImageUrl">

                <div>
                    <label class="block text-sm font-semibold text-gray-700">ชื่อสถานที่</label>
                    <input type="text" id="editName" required class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">ละติจูด (Lat)</label>
                        <input type="number" step="any" id="editLat" required class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">ลองจิจูด (Lng)</label>
                        <input type="number" step="any" id="editLng" required class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700">คำอธิบาย (ภาษาไทย)</label>
                    <textarea id="editDescTh" required rows="2" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">คำอธิบาย (ภาษาอังกฤษ)</label>
                    <textarea id="editDescEn" rows="2" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700">เปลี่ยนรูปภาพใหม่ (ถ้าต้องการเปลี่ยน)</label>
                    <input type="file" id="editImageFile" accept="image/*" class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700">
                    <p class="text-xs text-gray-400 mt-1">* หากไม่เลือกไฟล์ใหม่ ระบบจะใช้รูปภาพเดิม</p>
                </div>
                
                <button type="submit" id="updateBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                    💾 บันทึกการแก้ไข
                </button>
                <div id="modalStatus" class="hidden p-3 rounded-lg text-sm text-center font-medium mt-2"></div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvXRATBf2x1Lq_JToL2rlQYOh8mK65tIU",
            authDomain: "suchartstudio-9a78d.firebaseapp.com",
            databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "suchartstudio-9a78d",
            storageBucket: "suchartstudio-9a78d.firebasestorage.app",
            messagingSenderId: "953369646185",
            appId: "1:953369646185:web:e51f0e821d4fba1e6ebef8",
            measurementId: "G-LVGDE7H8ZK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 🟢 เปลี่ยนค่าตรงนี้เป็นของคุณ 🟢
        const CLOUD_NAME = "ใส่_CLOUD_NAME_ของคุณ"; 
        const UPLOAD_PRESET = "ใส่_UPLOAD_PRESET_ของคุณ";
        const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

        let placesData = {}; // เก็บข้อมูลไว้ใช้ตอนเปิด Modal

        // 1. ดึงข้อมูลและสร้าง List (แถว)
        window.loadList = async function() {
            const listContainer = document.getElementById('placesList');
            try {
                const querySnapshot = await getDocs(collection(db, "places"));
                listContainer.innerHTML = ''; // Clear loading text
                placesData = {}; 

                if (querySnapshot.empty) {
                    listContainer.innerHTML = '<div class="text-center text-gray-500 py-8 bg-white rounded-xl shadow">ไม่มีข้อมูลสถานที่</div>';
                    return;
                }
                
                querySnapshot.forEach((document) => {
                    const id = document.id;
                    const data = document.data();
                    placesData[id] = data; // บันทึกเก็บไว้

                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between p-4 bg-white shadow-sm rounded-xl border border-gray-100 hover:shadow-md transition';
                    row.innerHTML = `
                        <div class="flex items-center gap-4 overflow-hidden">
                            <img src="${data.imageUrl}" class="w-16 h-16 md:w-20 md:h-20 object-cover rounded-lg bg-gray-200 flex-shrink-0" onerror="this.src='https://placehold.co/100x100?text=No+Img'">
                            <div class="truncate">
                                <h3 class="font-bold text-gray-800 text-lg truncate">${data.name}</h3>
                                <p class="text-xs text-gray-500">Lat: ${data.lat}, Lng: ${data.lng}</p>
                            </div>
                        </div>
                        <div class="flex flex-col md:flex-row gap-2 ml-4">
                            <button onclick="openModal('${id}')" class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-200 whitespace-nowrap">✏️ แก้ไข</button>
                            <button onclick="deletePlace('${id}', '${data.name}')" class="bg-red-100 text-red-700 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-red-200 whitespace-nowrap">🗑️ ลบ</button>
                        </div>
                    `;
                    listContainer.appendChild(row);
                });
            } catch (error) {
                listContainer.innerHTML = '<div class="text-center text-red-500 py-8">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
            }
        }

        // 2. ฟังก์ชันเปิดหน้าต่างแก้ข้อมูล (Modal)
        window.openModal = function(id) {
            const data = placesData[id];
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = data.name;
            document.getElementById('editLat').value = data.lat;
            document.getElementById('editLng').value = data.lng;
            document.getElementById('editDescTh').value = data.descTh;
            document.getElementById('editDescEn').value = data.descEn || '';
            document.getElementById('oldImageUrl').value = data.imageUrl; // เก็บ URL เก่าเผื่อไม่เปลี่ยนรูป
            document.getElementById('editImageFile').value = ''; // เคลียร์ช่องเลือกไฟล์
            
            document.getElementById('editModal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('editModal').classList.add('hidden');
        }

        // 3. ฟังก์ชันอัปเดตข้อมูล
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const btn = document.getElementById('updateBtn');
            const statusBox = document.getElementById('modalStatus');
            const fileInput = document.getElementById('editImageFile');
            
            btn.disabled = true;
            statusBox.classList.remove('hidden', 'bg-red-100', 'text-red-700');
            statusBox.classList.add('bg-blue-100', 'text-blue-700');
            statusBox.innerText = "กำลังประมวลผล...";

            try {
                let finalImageUrl = document.getElementById('oldImageUrl').value; // ค่าเริ่มต้นคือรูปเก่า

                // ถ้ามีการเลือกไฟล์รูปใหม่ ให้ส่งไป Cloudinary ก่อน
                if (fileInput.files.length > 0) {
                    statusBox.innerText = "กำลังอัปโหลดรูปภาพใหม่...";
                    const formData = new FormData();
                    formData.append("file", fileInput.files[0]);
                    formData.append("upload_preset", UPLOAD_PRESET);

                    const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
                    const cloudinaryData = await res.json();
                    if (!res.ok) throw new Error("อัปโหลดรูปล้มเหลว");
                    finalImageUrl = cloudinaryData.secure_url;
                }

                statusBox.innerText = "กำลังบันทึกข้อมูล...";
                
                // บันทึกลง Firestore
                await updateDoc(doc(db, "places", id), {
                    name: document.getElementById('editName').value,
                    lat: parseFloat(document.getElementById('editLat').value),
                    lng: parseFloat(document.getElementById('editLng').value),
                    descTh: document.getElementById('editDescTh').value,
                    descEn: document.getElementById('editDescEn').value,
                    imageUrl: finalImageUrl
                });
                
                closeModal();
                loadList(); // รีเฟรชรายการใหม่
            } catch (error) {
                statusBox.classList.remove('bg-blue-100', 'text-blue-700');
                statusBox.classList.add('bg-red-100', 'text-red-700');
                statusBox.innerText = "Error: " + error.message;
            } finally {
                btn.disabled = false;
            }
        });

        // 4. ฟังก์ชันลบข้อมูล
        window.deletePlace = async function(id, name) {
            if(confirm(`ยืนยันการลบสถานที่ "${name}" หรือไม่?\n(ลบแล้วไม่สามารถกู้คืนได้)`)) {
                try {
                    await deleteDoc(doc(db, "places", id));
                    loadList(); // รีเฟรชรายการใหม่ทันที
                } catch (error) {
                    alert("เกิดข้อผิดพลาดในการลบ: " + error.message);
                }
            }
        }

        // โหลดข้อมูลครั้งแรก
        loadList();
    </script>
</body>
</html>
