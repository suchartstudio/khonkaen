<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มสถานที่ท่องเที่ยว (Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white p-6 md:p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">📍 เพิ่มสถานที่ (ขอนแก่น)</h2>
        
        <form id="addPlaceForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700">ชื่อสถานที่</label>
                <input type="text" id="name" required class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">ละติจูด (Lat)</label>
                    <input type="number" step="any" id="lat" required placeholder="16.4322" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">ลองจิจูด (Lng)</label>
                    <input type="number" step="any" id="lng" required placeholder="102.8236" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700">คำอธิบาย (ภาษาไทย)</label>
                <textarea id="descTh" required rows="3" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">คำอธิบาย (ภาษาอังกฤษ)</label>
                <textarea id="descEn" rows="2" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none text-sm"></textarea>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700">ภาพถ่ายสถานที่</label>
                <input type="file" id="imageFile" accept="image/*" required class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <p class="text-xs text-gray-500 mt-1">* รูปจะถูกอัปโหลดไป Cloudinary</p>
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200 disabled:opacity-50">
                บันทึกข้อมูล
            </button>
            
            <div id="statusBox" class="hidden p-3 rounded-lg text-sm text-center font-medium mt-2"></div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        // Firebase Config ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyBvXRATBf2x1Lq_JToL2rlQYOh8mK65tIU",
            authDomain: "suchartstudio-9a78d.firebaseapp.com",
            databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "suchartstudio-9a78d",
            storageBucket: "suchartstudio-9a78d.firebasestorage.app",
            messagingSenderId: "953369646185",
            appId: "1:953369646185:web:e51f0e821d4fba1e6ebef8",
            measurementId: "G-LVGDE7H8ZK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 🟢 ตั้งค่า Cloudinary (นำข้อมูลของคุณมาใส่ตรงนี้)
        const CLOUD_NAME = "dk0ypev4m"; 
        const UPLOAD_PRESET = "khonkaen_preset";
        const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

        function showStatus(message, type) {
            const statusBox = document.getElementById('statusBox');
            statusBox.classList.remove('hidden', 'bg-blue-100', 'text-blue-700', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
            if(type === 'loading') statusBox.classList.add('bg-blue-100', 'text-blue-700');
            else if(type === 'success') statusBox.classList.add('bg-green-100', 'text-green-700');
            else if(type === 'error') statusBox.classList.add('bg-red-100', 'text-red-700');
            statusBox.innerText = message;
        }

        document.getElementById('addPlaceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "กำลังอัปโหลดรูปภาพ...";
            
            showStatus("กำลังอัปโหลดภาพไป Cloudinary...", 'loading');
            
            const file = document.getElementById('imageFile').files[0];
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            try {
                // 1. อัปโหลดภาพไป Cloudinary
                const res = await fetch(CLOUDINARY_URL, {
                    method: "POST",
                    body: formData
                });
                const cloudinaryData = await res.json();

                if (!res.ok) {
                    throw new Error(cloudinaryData.error.message || "อัปโหลดรูปล้มเหลว");
                }

                const imageUrl = cloudinaryData.secure_url; // ได้ลิงก์รูปถาวรมาแล้ว
                
                showStatus("อัปโหลดสำเร็จ! กำลังบันทึกข้อมูล...", 'loading');
                btn.innerText = "กำลังบันทึกข้อมูล...";

                // 2. บันทึกข้อมูลลง Firebase
                await addDoc(collection(db, "places"), {
                    name: document.getElementById('name').value,
                    lat: parseFloat(document.getElementById('lat').value),
                    lng: parseFloat(document.getElementById('lng').value),
                    descTh: document.getElementById('descTh').value,
                    descEn: document.getElementById('descEn').value,
                    imageUrl: imageUrl 
                });
                
                showStatus("เพิ่มสถานที่สำเร็จเรียบร้อย!", 'success');
                document.getElementById('addPlaceForm').reset();
            } catch (error) {
                showStatus("เกิดข้อผิดพลาด: " + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = "บันทึกข้อมูล";
                if(document.getElementById('statusBox').classList.contains('bg-green-100')) {
                    setTimeout(() => document.getElementById('statusBox').classList.add('hidden'), 5000);
                }
            }
        });
    </script>
</body>
</html>
