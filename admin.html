<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มสถานที่ท่องเที่ยว (Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-white p-6 md:p-8 rounded-xl shadow-lg my-8">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">📍 เพิ่มสถานที่ (ขอนแก่น)</h2>
        
        <form id="addPlaceForm" class="space-y-4">
            <!-- ส่วนค้นหาชื่อและแผนที่ -->
            <div>
                <label class="block text-sm font-semibold text-gray-700">ชื่อสถานที่</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="name" required placeholder="เช่น บึงแก่นนคร" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <button type="button" id="searchLocationBtn" class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition text-sm whitespace-nowrap">
                        🔍 ค้นหาพิกัด
                    </button>
                </div>
            </div>

            <!-- แผนที่สำหรับปักหมุด -->
            <div class="border rounded-lg overflow-hidden relative">
                <div id="adminMap" style="height: 250px; width: 100%; z-index: 1;"></div>
                <div class="absolute top-2 right-2 bg-white/90 px-2 py-1 rounded text-xs z-[1000] shadow pointer-events-none">
                    คลิกหรือลากหมุดเพื่อระบุตำแหน่ง
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">ละติจูด (Lat)</label>
                    <input type="number" step="any" id="lat" required class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" readonly>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">ลองจิจูด (Lng)</label>
                    <input type="number" step="any" id="lng" required class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" readonly>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700">คำอธิบาย (ภาษาไทย)</label>
                <textarea id="descTh" required rows="2" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">คำอธิบาย (ภาษาอังกฤษ)</label>
                <textarea id="descEn" rows="2" class="w-full border border-gray-300 p-2.5 rounded-lg mt-1 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>
            
            <!-- อัปโหลดไฟล์ขึ้น Cloudinary -->
            <div>
                <label class="block text-sm font-semibold text-gray-700">ภาพถ่ายสถานที่</label>
                <input type="file" id="imageFile" accept="image/*" required class="w-full border border-gray-300 p-2 rounded-lg mt-1 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <p class="text-xs text-gray-500 mt-1">* รูปจะถูกอัปโหลดไป Cloudinary</p>
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                💾 บันทึกข้อมูล
            </button>
            
            <div id="statusBox" class="hidden p-3 rounded-lg text-sm text-center font-medium mt-2"></div>
        </form>

        <div class="mt-4 text-center">
            <a href="edit.html" class="text-sm text-blue-600 hover:underline">ไปหน้าจัดการข้อมูล (แก้ไข/ลบ) ➡️</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvXRATBf2x1Lq_JToL2rlQYOh8mK65tIU",
            authDomain: "suchartstudio-9a78d.firebaseapp.com",
            databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "suchartstudio-9a78d",
            storageBucket: "suchartstudio-9a78d.firebasestorage.app",
            messagingSenderId: "953369646185",
            appId: "1:953369646185:web:e51f0e821d4fba1e6ebef8",
            measurementId: "G-LVGDE7H8ZK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 🟢 ข้อมูล Cloudinary ของคุณ 🟢
        const CLOUD_NAME = "dk0ypev4m"; 
        const UPLOAD_PRESET = "khonkaen_preset";
        const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

        // ระบบแผนที่
        let adminMap = L.map('adminMap').setView([16.4322, 102.8236], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(adminMap);
        let marker = L.marker([16.4322, 102.8236], { draggable: true }).addTo(adminMap);

        marker.on('dragend', function(e) {
            const position = marker.getLatLng();
            document.getElementById('lat').value = position.lat.toFixed(6);
            document.getElementById('lng').value = position.lng.toFixed(6);
        });

        adminMap.on('click', function(e) {
            marker.setLatLng(e.latlng);
            document.getElementById('lat').value = e.latlng.lat.toFixed(6);
            document.getElementById('lng').value = e.latlng.lng.toFixed(6);
        });

        // ค้นหาชื่อ
        document.getElementById('searchLocationBtn').addEventListener('click', async () => {
            const placeName = document.getElementById('name').value;
            const btn = document.getElementById('searchLocationBtn');
            if(!placeName) return alert("กรุณากรอกชื่อสถานที่ก่อนค้นหา");

            btn.innerText = "กำลังหา...";
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(placeName + ' ขอนแก่น')}`);
                const data = await response.json();
                if(data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);
                    adminMap.setView([lat, lng], 16);
                    marker.setLatLng([lat, lng]);
                    document.getElementById('lat').value = lat.toFixed(6);
                    document.getElementById('lng').value = lng.toFixed(6);
                } else {
                    alert("ไม่พบตำแหน่งนี้ในระบบแผนที่ กรุณาเลื่อนหมุดด้วยตนเอง");
                }
            } catch (error) {
                alert("เกิดข้อผิดพลาดในการค้นหา");
            } finally {
                btn.innerText = "🔍 ค้นหาพิกัด";
            }
        });

        function showStatus(message, type) {
            const statusBox = document.getElementById('statusBox');
            statusBox.classList.remove('hidden', 'bg-blue-100', 'text-blue-700', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
            if(type === 'loading') statusBox.classList.add('bg-blue-100', 'text-blue-700');
            else if(type === 'success') statusBox.classList.add('bg-green-100', 'text-green-700');
            else if(type === 'error') statusBox.classList.add('bg-red-100', 'text-red-700');
            statusBox.innerText = message;
        }

        // ระบบบันทึก
        document.getElementById('addPlaceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            showStatus("กำลังอัปโหลดภาพไป Cloudinary...", 'loading');
            
            const file = document.getElementById('imageFile').files[0];
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            try {
                const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
                const cloudinaryData = await res.json();
                if (!res.ok) throw new Error(cloudinaryData.error.message || "อัปโหลดรูปล้มเหลว");

                const imageUrl = cloudinaryData.secure_url;
                showStatus("อัปโหลดสำเร็จ! กำลังบันทึกข้อมูล...", 'loading');

                await addDoc(collection(db, "places"), {
                    name: document.getElementById('name').value,
                    lat: parseFloat(document.getElementById('lat').value),
                    lng: parseFloat(document.getElementById('lng').value),
                    descTh: document.getElementById('descTh').value,
                    descEn: document.getElementById('descEn').value,
                    imageUrl: imageUrl 
                });
                
                showStatus("เพิ่มสถานที่สำเร็จเรียบร้อย!", 'success');
                document.getElementById('addPlaceForm').reset();
                adminMap.setView([16.4322, 102.8236], 13);
                marker.setLatLng([16.4322, 102.8236]);
            } catch (error) {
                showStatus("เกิดข้อผิดพลาด: " + error.message, 'error');
            } finally {
                btn.disabled = false;
                setTimeout(() => document.getElementById('statusBox').classList.add('hidden'), 5000);
            }
        });
    </script>
</body>
</html>
