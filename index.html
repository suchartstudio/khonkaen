<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ที่เที่ยวขอนแก่น Khon Kaen Guide</title>
    
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลด Leaflet CSS สำหรับแผนที่ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- นำเข้า Google Fonts: Chakra Petch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* บังคับใช้ฟอนต์ Chakra Petch ทั้งเว็บไซต์ */
        body { font-family: 'Chakra Petch', sans-serif; }
        
        #map { height: 60vh; width: 100%; z-index: 1; }
        .slider-container { 
            height: 40vh; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            display: flex; 
            padding: 1rem; 
            gap: 1rem; 
            background: #f3f4f6; 
        }
        .card { 
            min-width: 85%; 
            scroll-snap-align: center; 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) {
            .card { min-width: 300px; }
        }
        .card img { 
            height: 150px; 
            width: 100%; 
            object-fit: cover; 
            background-color: #e5e7eb;
        }
        .slider-container::-webkit-scrollbar { display: none; }
        .slider-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden relative">

    <!-- ปุ่มเปิดหน้าต่าง จัดทริป (ลอยอยู่มุมขวาบน) -->
    <button onclick="window.toggleRoutePanel()" class="fixed top-4 right-4 z-[1000] bg-blue-600 text-white px-4 py-2.5 rounded-full shadow-lg font-bold flex items-center gap-2 hover:bg-blue-700 transition">
        🗺️ จัดทริป 
        <span id="routeBadge" class="bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-inner">0</span>
    </button>

    <!-- หน้าต่างสรุปทริปนำทาง (ซ่อนไว้เป็นค่าเริ่มต้น) -->
    <div id="routePanel" class="fixed top-16 right-4 z-[1000] bg-white rounded-xl shadow-2xl p-4 w-72 hidden flex-col gap-3 border border-gray-100 max-h-[50vh]">
        <h3 class="font-bold text-gray-800 text-lg border-b pb-2">🚗 เส้นทางของคุณ</h3>
        <ul id="routeList" class="text-sm text-gray-600 space-y-2 overflow-y-auto">
            <li class="text-gray-400 text-xs italic text-center py-2">ยังไม่ได้เลือกสถานที่</li>
        </ul>
        <div class="flex gap-2 pt-2 border-t mt-1">
            <button onclick="window.clearRoute()" class="flex-1 bg-red-50 text-red-600 py-2 rounded-lg text-sm font-bold hover:bg-red-100 transition">ล้าง</button>
            <button onclick="window.startNavigation()" class="flex-[2] bg-green-500 text-white py-2 px-4 rounded-lg text-sm font-bold hover:bg-green-600 transition shadow-sm">🚀 นำทางเลย</button>
        </div>
    </div>

    <!-- ส่วนแสดงแผนที่ -->
    <div id="map"></div>

    <!-- ส่วนการ์ดสไลด์แสดงข้อมูล -->
    <div id="places-slider" class="slider-container">
        <div class="w-full flex items-center justify-center text-gray-500">
            กำลังโหลดข้อมูลสถานที่...
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvXRATBf2x1Lq_JToL2rlQYOh8mK65tIU",
            authDomain: "suchartstudio-9a78d.firebaseapp.com",
            databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "suchartstudio-9a78d",
            storageBucket: "suchartstudio-9a78d.firebasestorage.app",
            messagingSenderId: "953369646185",
            appId: "1:953369646185:web:e51f0e821d4fba1e6ebef8",
            measurementId: "G-LVGDE7H8ZK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = L.map('map').setView([16.4322, 102.8236], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        // --- ระบบจัดทริปนำทาง (Route Planner Logic) ---
        window.selectedPlaces = []; // ตัวแปรเก็บสถานที่ที่เลือกเรียงตามลำดับ

        // ฟังก์ชันเลือก/ยกเลิกสถานที่
        window.toggleRoute = function(id, name, lat, lng) {
            const index = window.selectedPlaces.findIndex(p => p.id === id);
            const btn = document.getElementById(`btn-${id}`);
            
            if(index > -1) {
                // ถ้ามีอยู่แล้วให้เอาออก
                window.selectedPlaces.splice(index, 1);
                if(btn) {
                    btn.innerHTML = "📍 เพิ่มลงทริป";
                    btn.className = "mt-3 bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2 rounded-lg text-sm font-bold w-full hover:bg-blue-100 transition shadow-sm";
                }
            } else {
                // ถ้ายังไม่มีให้เพิ่มเข้าไป
                window.selectedPlaces.push({ id, name, lat, lng });
                if(btn) {
                    btn.innerHTML = "✅ เลือกแล้ว";
                    btn.className = "mt-3 bg-green-50 text-green-700 border border-green-300 px-4 py-2 rounded-lg text-sm font-bold w-full hover:bg-green-100 transition shadow-sm";
                }
            }
            window.updateRouteUI();
        }

        // ฟังก์ชันอัปเดตหน้าต่างสรุปทริป
        window.updateRouteUI = function() {
            const count = window.selectedPlaces.length;
            document.getElementById('routeBadge').innerText = count;
            
            const list = document.getElementById('routeList');
            list.innerHTML = '';
            
            if(count === 0) {
                list.innerHTML = '<li class="text-gray-400 text-xs italic text-center py-2">ยังไม่ได้เลือกสถานที่</li>';
            } else {
                window.selectedPlaces.forEach((p, idx) => {
                    list.innerHTML += `
                        <li class="flex items-center gap-2 bg-gray-50 p-2 rounded-lg border border-gray-100">
                            <span class="bg-blue-100 text-blue-700 rounded-full min-w-[24px] h-6 flex items-center justify-center text-xs font-bold">${idx+1}</span> 
                            <span class="truncate text-gray-800 font-medium">${p.name}</span>
                        </li>`;
                });
            }
        }

        // ฟังก์ชันเปิด/ปิดหน้าต่างทริป
        window.toggleRoutePanel = function() {
            const panel = document.getElementById('routePanel');
            if(panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
            } else {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
            }
        }

        // ฟังก์ชันล้างข้อมูลทริป
        window.clearRoute = function() {
            window.selectedPlaces = [];
            // รีเซ็ตปุ่มทั้งหมดกลับเป็นสีฟ้า
            document.querySelectorAll('[id^="btn-"]').forEach(btn => {
                btn.innerHTML = "📍 เพิ่มลงทริป";
                btn.className = "mt-3 bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2 rounded-lg text-sm font-bold w-full hover:bg-blue-100 transition shadow-sm";
            });
            window.updateRouteUI();
            window.toggleRoutePanel(); 
        }

        // ฟังก์ชันส่งพิกัดไป Google Maps
        window.startNavigation = function() {
            if(window.selectedPlaces.length === 0) {
                alert("กรุณาเลือกสถานที่ที่ต้องการไปอย่างน้อย 1 แห่งครับ");
                return;
            }
            
            // สร้าง URL Google Maps แบบหลายจุดแวะ (Waypoints)
            // รูปแบบ: https://www.google.com/maps/dir/Lat1,Lng1/Lat2,Lng2/Lat3,Lng3
            const coordsString = window.selectedPlaces.map(p => `${p.lat},${p.lng}`).join('/');
            const mapsUrl = `https://www.google.com/maps/dir/${coordsString}`;
            
            // เปิดแท็บใหม่ (มือถือจะเด้งเข้าแอปอัตโนมัติ)
            window.open(mapsUrl, '_blank');
        }

        // --- ระบบดึงข้อมูลแผนที่หลัก ---
        async function loadPlaces() {
            try {
                const querySnapshot = await getDocs(collection(db, "places"));
                const slider = document.getElementById('places-slider');
                
                slider.innerHTML = '';

                if (querySnapshot.empty) {
                    slider.innerHTML = '<div class="w-full flex items-center justify-center text-gray-500 font-medium">ยังไม่มีข้อมูลสถานที่</div>';
                    return;
                }
                
                querySnapshot.forEach((docSnapshot) => {
                    const id = docSnapshot.id;
                    const data = docSnapshot.data();
                    
                    const marker = L.marker([data.lat, data.lng]).addTo(map);
                    marker.bindPopup(`<b class="text-base" style="font-family: 'Chakra Petch', sans-serif;">${data.name}</b>`);

                    const card = document.createElement('div');
                    card.className = 'card cursor-pointer';
                    // เพิ่ม event.stopPropagation() เพื่อไม่ให้การกดปุ่มไปทริกเกอร์การเลื่อนแผนที่ของการ์ด
                    card.innerHTML = `
                        <img src="${data.imageUrl}" alt="${data.name}" onerror="this.onerror=null; this.src='https://placehold.co/400x200/eeeeee/999999?text=No+Image';">
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="text-lg font-bold text-gray-800 leading-tight">${data.name}</h3>
                                <p class="text-sm text-gray-600 mt-1 line-clamp-2">${data.descTh}</p>
                            </div>
                            <button id="btn-${id}" onclick="event.stopPropagation(); window.toggleRoute('${id}', '${data.name}', ${data.lat}, ${data.lng})" class="mt-3 bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2 rounded-lg text-sm font-bold w-full hover:bg-blue-100 transition shadow-sm">
                                📍 เพิ่มลงทริป
                            </button>
                        </div>
                    `;
                    
                    card.addEventListener('click', () => {
                        map.flyTo([data.lat, data.lng], 16, { duration: 1.5 });
                        setTimeout(() => marker.openPopup(), 1500);
                    });

                    slider.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading places:", error);
                document.getElementById('places-slider').innerHTML = 
                    `<div class="w-full flex items-center justify-center text-red-500 font-bold">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
            }
        }

        loadPlaces();
    </script>
</body>
</html>
