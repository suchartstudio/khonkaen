<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ที่เที่ยวขอนแก่น Khon Kaen Guide</title>
    
    <!-- ตั้งค่า PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Chakra Petch', sans-serif; background-color: #f8fafc; }
        
        #map { flex: 1; min-height: 40vh; width: 100%; z-index: 1; }
        
        .slider-container { padding: 1rem; gap: 1rem; background: #f1f5f9; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; align-items: stretch; }
        .card { min-width: 85%; max-width: 85%; height: auto; scroll-snap-align: center; background: white; border-radius: 1.25rem; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; border: 1px solid #e2e8f0; }
        @media (min-width: 768px) { .card { min-width: 320px; max-width: 320px; } }
        .slider-container::-webkit-scrollbar { display: none; }
        .slider-container { -ms-overflow-style: none; scrollbar-width: none; }

        .transparent-popup .leaflet-popup-content-wrapper { background: transparent; border: none; box-shadow: none; }
        .transparent-popup .leaflet-popup-tip-container { display: none; }
        .transparent-popup .leaflet-popup-content { margin: 0; text-align: center; }
        .custom-text-outline { color: #ffffff; font-size: 1.25rem; white-space: nowrap; font-weight: 700; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px  2px 0 #000, 2px  2px 0 #000, 0px 4px 8px rgba(0,0,0,0.9); }
        
        .user-location-marker { background-color: #3b82f6; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(59, 130, 246, 0.8); position: relative; z-index: 1000; }
        .user-location-marker::after { content: ''; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px; border-radius: 50%; border: 2px solid #3b82f6; animation: pulse 1.5s infinite; opacity: 0; }
        @keyframes pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden relative">

    <button id="installAppBtn" class="fixed top-5 left-5 z-[1000] bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-4 py-2.5 rounded-2xl shadow-xl font-bold flex items-center gap-2 hover:scale-105 active:scale-95 transition-all hidden">
        📱 ติดตั้งแอป
    </button>

    <button onclick="window.toggleRoutePanel()" class="fixed top-5 right-5 z-[1000] bg-blue-600 text-white px-5 py-2.5 rounded-2xl shadow-xl font-bold flex items-center gap-2 hover:bg-blue-700 active:scale-95 transition-all">
        <span class="text-xl">🗺️</span> ทริป 
        <span id="routeBadge" class="bg-white text-blue-600 rounded-lg px-2 py-0.5 text-sm shadow-inner">0</span>
    </button>

    <div id="routePanel" class="fixed top-20 right-5 z-[1000] bg-white rounded-2xl shadow-2xl p-5 w-80 hidden flex-col gap-4 border border-slate-200 max-h-[60vh]">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
            <h3 class="font-bold text-slate-800 text-xl">🚗 แผนเดินทาง</h3>
            <button onclick="window.sortTrip(); window.updateRouteUI();" class="text-[10px] bg-blue-50 text-blue-600 px-2.5 py-1.5 rounded-lg font-bold border border-blue-200 hover:bg-blue-100 transition shadow-sm active:scale-95">
                ✨ เรียงใกล้ ➜ ไกล
            </button>
        </div>
        
        <ul id="routeList" class="text-slate-600 space-y-3 overflow-y-auto pr-1">
            <li class="text-slate-400 text-sm italic text-center py-4">ยังไม่ได้ปักหมุดสถานที่</li>
        </ul>
        <div class="flex gap-3 pt-3 border-t">
            <button onclick="window.clearRoute()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl text-sm font-bold hover:bg-slate-200 transition">ล้างทริป</button>
            <button onclick="window.startNavigation()" class="flex-[2] bg-blue-600 text-white py-3 px-4 rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">🚀 เริ่มนำทาง</button>
        </div>
    </div>

    <div id="reviewModal" class="fixed inset-0 bg-slate-900/80 z-[2000] hidden flex items-center justify-center p-5 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg text-slate-800 truncate pr-4" id="reviewPlaceName">ชื่อสถานที่</h3>
                <button onclick="window.closeReviewModal()" class="bg-slate-200 text-slate-600 w-8 h-8 rounded-full flex items-center justify-center font-bold hover:bg-red-100 hover:text-red-500 transition">&times;</button>
            </div>
            <div id="reviewsContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50"></div>
            <form id="reviewForm" class="p-5 border-t bg-white space-y-3">
                <input type="hidden" id="reviewPlaceId">
                <div class="flex items-center justify-between">
                    <span class="font-bold text-slate-700">ความประทับใจ:</span>
                    <div id="starSelector" class="flex text-2xl cursor-pointer text-slate-200 gap-1">
                        <span class="star-btn" data-val="1">★</span><span class="star-btn" data-val="2">★</span><span class="star-btn" data-val="3">★</span><span class="star-btn" data-val="4">★</span><span class="star-btn" data-val="5">★</span>
                    </div>
                    <input type="hidden" id="selectedRating" required>
                </div>
                <textarea id="reviewText" required rows="2" placeholder="เขียนแชร์ประสบการณ์ที่นี่..." class="w-full border border-slate-200 p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition-all"></textarea>
                <button type="submit" id="submitReviewBtn" class="w-full bg-yellow-400 text-yellow-900 font-bold py-3 rounded-xl hover:bg-yellow-500 transition shadow-md">ส่งรีวิว</button>
            </form>
        </div>
    </div>

    <div id="map"></div>
    <div id="places-slider" class="slider-container"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <script type="module">
        // 🟢 เพิ่มการดึง onSnapshot เข้ามา เพื่ออัปเดตแบบเรียลไทม์ 🟢
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, query, orderBy, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error', err)); }); }

        let deferredPrompt; const installBtn = document.getElementById('installAppBtn');
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.classList.remove('hidden'); });
        installBtn.addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') installBtn.classList.add('hidden'); deferredPrompt = null; } });
        window.addEventListener('appinstalled', () => { installBtn.classList.add('hidden'); });

        const firebaseConfig = {
            apiKey: "AIzaSyBvXRATBf2x1Lq_JToL2rlQYOh8mK65tIU",
            authDomain: "suchartstudio-9a78d.firebaseapp.com",
            databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "suchartstudio-9a78d",
            storageBucket: "suchartstudio-9a78d.firebasestorage.app",
            messagingSenderId: "953369646185",
            appId: "1:953369646185:web:e51f0e821d4fba1e6ebef8",
            measurementId: "G-LVGDE7H8ZK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = L.map('map', { zoomControl: false }).setView([16.4322, 102.8236], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let startTime = Date.now(); let statDocId = null;
        const getDeviceType = () => { const ua = navigator.userAgent; if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) return "Tablet"; if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry|Kindle|Silk-mobi/i.test(ua)) return "Mobile"; return "Desktop"; };
        async function startTracking(location) { try { const docRef = await addDoc(collection(db, "site_statistics"), { device: getDeviceType(), location: location, timestamp: Date.now(), duration: 0, userAgent: navigator.userAgent }); statDocId = docRef.id; setInterval(updateDuration, 10000); } catch (e) { } }
        async function updateDuration() { if (!statDocId) return; try { await updateDoc(doc(db, "site_statistics", statDocId), { duration: Math.floor((Date.now() - startTime) / 1000) }); } catch (e) { } }

        // --- 🟢 ระบบ Heatmap เรียลไทม์ และตำแหน่ง 🟢 ---
        window.userCurrentLocation = null;
        let globalHeatLayer = null; // ตัวแปรเก็บเลเยอร์ Heatmap

        async function initUserLocationAndHeatmap() {
            let locForStats = { lat: null, lng: null };
            
            // 1. ดึงตำแหน่งผู้ใช้ปัจจุบันและปักหมุดสีฟ้า
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    window.userCurrentLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                    locForStats = window.userCurrentLocation;
                    const userIcon = L.divIcon({ className: 'user-location-marker', iconSize: [16, 16] });
                    L.marker([window.userCurrentLocation.lat, window.userCurrentLocation.lng], { icon: userIcon }).addTo(map).bindPopup("<b style='font-family: Chakra Petch;'>📍 ตำแหน่งของคุณ</b>");
                    map.setView([window.userCurrentLocation.lat, window.userCurrentLocation.lng], 14);
                    try { await addDoc(collection(db, "user_locations"), { lat: window.userCurrentLocation.lat, lng: window.userCurrentLocation.lng, timestamp: Date.now() }); } catch (e) {}
                    startTracking(locForStats);
                }, () => { startTracking(locForStats); });
            } else { startTracking(locForStats); }

            // 2. โหลด Heatmap ของทุกคนแบบ Real-time ด้วย onSnapshot
            onSnapshot(collection(db, "user_locations"), (snapshot) => {
                const heatData = [];
                snapshot.forEach(d => { 
                    const data = d.data();
                    if(data.lat && data.lng) {
                        heatData.push([data.lat, data.lng, 0.8]); // ระดับความเข้มข้น 0.8 ต่อ 1 คน
                    } 
                });

                // ลบเลเยอร์ความร้อนเก่าออกก่อน (ถ้ามี) แล้ววาดใหม่ทับ
                if(globalHeatLayer) {
                    map.removeLayer(globalHeatLayer);
                }

                if(heatData.length > 0) {
                    globalHeatLayer = L.heatLayer(heatData, { 
                        radius: 30,      // รัศมีกว้างขึ้นให้มองเห็นง่าย
                        blur: 20,        // ฟุ้งสวยงาม
                        maxZoom: 15,     
                        gradient: { 0.4: 'blue', 0.6: 'cyan', 0.8: 'lime', 1.0: 'red' } 
                    }).addTo(map);
                }
            });
        }

        window.selectedPlaces = []; 
        window.sortTrip = function() {
            if(!window.userCurrentLocation || window.selectedPlaces.length <= 1) {
                if(!window.userCurrentLocation) alert("ไม่พบพิกัดของคุณครับ (กรุณาอนุญาตให้เว็บเข้าถึง Location)"); return;
            }
            const userLatLng = L.latLng(window.userCurrentLocation.lat, window.userCurrentLocation.lng);
            window.selectedPlaces.sort((a, b) => userLatLng.distanceTo(L.latLng(a.lat, a.lng)) - userLatLng.distanceTo(L.latLng(b.lat, b.lng)));
        }

        window.moveRouteItem = function(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= window.selectedPlaces.length) return;
            const temp = window.selectedPlaces[index];
            window.selectedPlaces[index] = window.selectedPlaces[newIndex];
            window.selectedPlaces[newIndex] = temp;
            window.updateRouteUI();
        }

        window.toggleRoute = function(id, name, lat, lng) {
            const index = window.selectedPlaces.findIndex(p => p.id === id); const btn = document.getElementById(`btn-${id}`);
            if(index > -1) {
                window.selectedPlaces.splice(index, 1);
                if(btn) { btn.innerHTML = "📍 ลงทริป"; btn.className = "bg-white/95 backdrop-blur-md text-blue-700 border border-white/50 px-2.5 py-1.5 rounded-lg text-[11px] font-bold shadow-md hover:bg-blue-50 transition-all active:scale-90"; }
            } else {
                window.selectedPlaces.push({ id, name, lat, lng });
                if(btn) { btn.innerHTML = "✅ เลือกแล้ว"; btn.className = "bg-green-500 text-white border border-green-400 px-2.5 py-1.5 rounded-lg text-[11px] font-bold shadow-md shadow-green-200 transition-all active:scale-90"; }
            }
            window.updateRouteUI();
        }

        window.updateRouteUI = function() {
            document.getElementById('routeBadge').innerText = window.selectedPlaces.length;
            const list = document.getElementById('routeList');
            if(window.selectedPlaces.length === 0) { list.innerHTML = '<li class="text-slate-400 text-sm italic text-center py-4">ยังไม่ได้ปักหมุดสถานที่</li>'; } 
            else {
                list.innerHTML = window.selectedPlaces.map((p, idx) => {
                    let distanceBadge = '';
                    if (window.userCurrentLocation) {
                        const distKm = (L.latLng(window.userCurrentLocation.lat, window.userCurrentLocation.lng).distanceTo(L.latLng(p.lat, p.lng)) / 1000).toFixed(1);
                        distanceBadge = `<span class="text-[11px] font-bold text-blue-600 bg-blue-100/60 border border-blue-200/60 px-2 py-0.5 rounded-md whitespace-nowrap shadow-sm">${distKm} กม.</span>`;
                    }
                    return `
                    <li class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-100">
                        <div class="flex flex-col gap-0.5">
                            <button onclick="window.moveRouteItem(${idx}, -1)" class="text-slate-400 hover:text-blue-600 bg-slate-200/50 hover:bg-blue-100 rounded px-1.5 py-0.5 text-[10px] transition-colors ${idx === 0 ? 'invisible' : ''}">▲</button>
                            <button onclick="window.moveRouteItem(${idx}, 1)" class="text-slate-400 hover:text-blue-600 bg-slate-200/50 hover:bg-blue-100 rounded px-1.5 py-0.5 text-[10px] transition-colors ${idx === window.selectedPlaces.length - 1 ? 'invisible' : ''}">▼</button>
                        </div>
                        <span class="bg-blue-600 text-white rounded-lg min-w-[24px] h-6 flex items-center justify-center text-xs font-bold shadow-sm">${idx+1}</span> 
                        <div class="flex-1 flex items-center justify-between min-w-0 gap-2">
                            <span class="truncate text-slate-800 font-semibold text-sm">${p.name}</span>
                            ${distanceBadge}
                        </div>
                    </li>`;
                }).join('');
            }
        }

        window.toggleRoutePanel = () => { document.getElementById('routePanel').classList.toggle('hidden'); document.getElementById('routePanel').classList.toggle('flex'); }
        window.clearRoute = () => { window.selectedPlaces = []; document.querySelectorAll('[id^="btn-"]').forEach(btn => { btn.innerHTML = "📍 ลงทริป"; btn.className = "bg-white/95 backdrop-blur-md text-blue-700 border border-white/50 px-2.5 py-1.5 rounded-lg text-[11px] font-bold shadow-md hover:bg-blue-50 transition-all active:scale-90"; }); window.updateRouteUI(); window.toggleRoutePanel(); }
        window.startNavigation = () => { if(window.selectedPlaces.length === 0) return alert("กรุณาเลือกที่เที่ยวก่อนครับ"); window.open(`https://www.google.com/maps/dir//${window.selectedPlaces.map(p => `${p.lat},${p.lng}`).join('/')}`, '_blank'); }

        let currentRating = 0; const stars = document.querySelectorAll('.star-btn');
        stars.forEach(star => { star.addEventListener('click', function() { currentRating = parseInt(this.getAttribute('data-val')); document.getElementById('selectedRating').value = currentRating; stars.forEach(s => s.style.color = parseInt(s.getAttribute('data-val')) <= currentRating ? '#fbbf24' : '#e2e8f0'); }); });
        
        window.openReviewModal = async (placeId, placeName) => { document.getElementById('reviewPlaceId').value = placeId; document.getElementById('reviewPlaceName').innerText = placeName; document.getElementById('reviewModal').classList.remove('hidden'); document.getElementById('reviewModal').classList.add('flex'); document.getElementById('reviewForm').reset(); currentRating = 0; stars.forEach(s => s.style.color = '#e2e8f0'); await loadReviews(placeId); }
        window.closeReviewModal = () => { document.getElementById('reviewModal').classList.add('hidden'); document.getElementById('reviewModal').classList.remove('flex'); }

        async function loadReviews(placeId) {
            const container = document.getElementById('reviewsContainer'); container.innerHTML = '<div class="text-center text-slate-400 text-sm py-4">กำลังเปิดสมุดรีวิว...</div>';
            try {
                const q = query(collection(db, "places", placeId, "reviews"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                if (querySnapshot.empty) { container.innerHTML = '<div class="text-center text-slate-400 text-sm py-8 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">ยังไม่มีรีวิว เขียนเป็นคนแรกได้เลย! ✨</div>'; return; }
                container.innerHTML = querySnapshot.docs.map(doc => { const rev = doc.data(); const starsHtml = '★'.repeat(rev.rating) + '☆'.repeat(5 - rev.rating); return `<div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100"><div class="text-yellow-500 text-base tracking-wider">${starsHtml}</div><p class="text-slate-700 mt-1.5 leading-relaxed text-sm">${rev.text}</p><div class="text-[10px] text-slate-400 mt-2 text-right uppercase font-bold tracking-tighter">${new Date(rev.timestamp).toLocaleDateString('th-TH')}</div></div>`; }).join('');
            } catch (error) { container.innerHTML = `<div class="text-center text-red-400 text-sm py-4">โหลดข้อมูลล้มเหลว</div>`; }
        }

        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault(); const rating = document.getElementById('selectedRating').value; const text = document.getElementById('reviewText').value; const placeId = document.getElementById('reviewPlaceId').value;
            if(!rating || rating == 0) return alert("รบกวนให้ดาวนิดนึงนะครับ");
            const btn = document.getElementById('submitReviewBtn'); btn.disabled = true; btn.innerText = "กำลังจดบันทึก...";
            try { await addDoc(collection(db, "places", placeId, "reviews"), { rating: parseInt(rating), text: text, timestamp: Date.now() }); await loadReviews(placeId); document.getElementById('reviewForm').reset(); currentRating = 0; stars.forEach(s => s.style.color = '#e2e8f0'); } catch (error) { alert("ล้มเหลว: " + error.message); } finally { btn.disabled = false; btn.innerText = "ส่งรีวิว"; }
        });

        async function loadPlaces() {
            try {
                const querySnapshot = await getDocs(collection(db, "places"));
                const slider = document.getElementById('places-slider'); slider.innerHTML = '';
                querySnapshot.forEach((docSnapshot) => {
                    const id = docSnapshot.id; const data = docSnapshot.data();
                    const customIcon = L.divIcon({ className: '', html: `<div style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid white; overflow: hidden; box-shadow: 0px 6px 12px rgba(0,0,0,0.2); background: white;"><img src="${data.imageUrl}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://placehold.co/100x100?text=KK'"></div>`, iconSize: [48, 48], iconAnchor: [24, 24], popupAnchor: [0, -28] });
                    const marker = L.marker([data.lat, data.lng], { icon: customIcon }).addTo(map);
                    marker.bindPopup(`<div class="custom-text-outline">${data.name}</div>`, { className: 'transparent-popup', closeButton: false });

                    const card = document.createElement('div'); card.className = 'card cursor-pointer';
                    card.innerHTML = `
                        <div class="relative w-full h-[120px] shrink-0">
                            <img src="${data.imageUrl}" alt="${data.name}" class="w-full h-full object-cover bg-slate-200" onerror="this.onerror=null; this.src='https://placehold.co/400x200?text=Khon+Kaen';">
                            <div class="absolute top-2 right-2 flex gap-1.5 z-10">
                                <button id="btn-${id}" onclick="event.stopPropagation(); window.toggleRoute('${id}', '${data.name}', ${data.lat}, ${data.lng})" class="bg-white/95 backdrop-blur-md text-blue-700 border border-white/50 px-2.5 py-1.5 rounded-lg text-[11px] font-bold shadow-md hover:bg-blue-50 transition-all active:scale-90">📍 ลงทริป</button>
                                <button onclick="event.stopPropagation(); window.openReviewModal('${id}', '${data.name}')" class="bg-white/95 backdrop-blur-md text-amber-600 border border-white/50 px-2.5 py-1.5 rounded-lg text-[11px] font-bold shadow-md hover:bg-amber-50 transition-all active:scale-90">⭐ รีวิว</button>
                            </div>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-start overflow-hidden">
                            <h3 class="text-lg font-bold text-slate-800 leading-tight mb-1 truncate">${data.name}</h3>
                            <p class="text-sm text-slate-500 leading-relaxed line-clamp-2">${data.descTh}</p>
                        </div>
                    `;
                    card.addEventListener('click', () => { map.flyTo([data.lat, data.lng], 16, { duration: 1.5 }); setTimeout(() => marker.openPopup(), 1500); });
                    slider.appendChild(card);
                });
            } catch (error) { slider.innerHTML = `<div class="w-full flex items-center justify-center text-red-500 font-bold">เกิดข้อผิดพลาดในการเชื่อมต่อ</div>`; }
        }

        loadPlaces();
        initUserLocationAndHeatmap();
    </script>
</body>
</html>
