<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ที่เที่ยวขอนแก่น Khon Kaen Guide</title>
    
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลด Leaflet CSS สำหรับแผนที่ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- นำเข้า Google Fonts: Chakra Petch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Chakra Petch', sans-serif; }
        
        #map { height: 55vh; width: 100%; z-index: 1; }
        
        .slider-container { 
            height: 45vh; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            display: flex; 
            padding: 1rem; 
            gap: 1rem; 
            background: #f3f4f6; 
            align-items: stretch; 
        }
        
        .card { 
            min-width: 85%; max-width: 85%;
            height: 100%; 
            scroll-snap-align: center; 
            background: white; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            display: flex; flex-direction: column;
        }
        
        @media (min-width: 768px) {
            .card { min-width: 300px; max-width: 300px; }
        }
        
        .card img { 
            height: 130px; width: 100%; 
            object-fit: cover; background-color: #e5e7eb; flex-shrink: 0;
        }
        
        .slider-container::-webkit-scrollbar { display: none; }
        .slider-container { -ms-overflow-style: none; scrollbar-width: none; }

        .transparent-popup .leaflet-popup-content-wrapper {
            background: transparent; border: none; box-shadow: none;
        }
        .transparent-popup .leaflet-popup-tip-container { display: none; }
        .transparent-popup .leaflet-popup-content { margin: 0; text-align: center; }
        
        .custom-text-outline {
            color: #ffffff; font-size: 1.1rem; white-space: nowrap;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px  2px 0 #000, 2px  2px 0 #000, 0px  4px 6px rgba(0,0,0,0.8);
        }
        
        /* สไตล์สำหรับดาวรีวิว */
        .star-btn { transition: color 0.2s; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden relative">

    <!-- ปุ่มจัดทริป -->
    <button onclick="window.toggleRoutePanel()" class="fixed top-4 right-4 z-[1000] bg-blue-600 text-white px-4 py-2.5 rounded-full shadow-lg font-bold flex items-center gap-2 hover:bg-blue-700 transition">
        🗺️ ทริป 
        <span id="routeBadge" class="bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-inner">0</span>
    </button>

    <!-- หน้าต่างสรุปทริปนำทาง -->
    <div id="routePanel" class="fixed top-16 right-4 z-[1000] bg-white rounded-xl shadow-2xl p-4 w-72 hidden flex-col gap-3 border border-gray-100 max-h-[50vh]">
        <h3 class="font-bold text-gray-800 text-lg border-b pb-2">🚗 เส้นทางของคุณ</h3>
        <ul id="routeList" class="text-sm text-gray-600 space-y-2 overflow-y-auto">
            <li class="text-gray-400 text-xs italic text-center py-2">ยังไม่ได้เลือกสถานที่</li>
        </ul>
        <div class="flex gap-2 pt-2 border-t mt-1">
            <button onclick="window.clearRoute()" class="flex-1 bg-red-50 text-red-600 py-2 rounded-lg text-sm font-bold hover:bg-red-100 transition">ล้าง</button>
            <button onclick="window.startNavigation()" class="flex-[2] bg-green-500 text-white py-2 px-4 rounded-lg text-sm font-bold hover:bg-green-600 transition shadow-sm">🚀 นำทางเลย</button>
        </div>
    </div>

    <!-- 🟢 หน้าต่าง (Modal) สำหรับรีวิว 🟢 -->
    <div id="reviewModal" class="fixed inset-0 bg-black/60 z-[2000] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            <!-- หัว Modal -->
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-lg text-gray-800 flex-1 truncate pr-4" id="reviewPlaceName">ชื่อสถานที่</h3>
                <button onclick="window.closeReviewModal()" class="text-gray-400 hover:text-red-500 text-2xl leading-none">&times;</button>
            </div>
            
            <!-- ส่วนแสดงรีวิวเดิม (เลื่อนขึ้นลงได้) -->
            <div id="reviewsContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-100/50">
                <div class="text-center text-gray-400 text-sm py-4">กำลังโหลดรีวิว...</div>
            </div>

            <!-- ส่วนเขียนรีวิวใหม่ -->
            <form id="reviewForm" class="p-4 border-t bg-white space-y-3">
                <input type="hidden" id="reviewPlaceId">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-bold text-gray-700">ให้คะแนน:</span>
                    <div id="starSelector" class="flex text-2xl cursor-pointer text-gray-300">
                        <span class="star-btn hover:scale-110" data-val="1">★</span>
                        <span class="star-btn hover:scale-110" data-val="2">★</span>
                        <span class="star-btn hover:scale-110" data-val="3">★</span>
                        <span class="star-btn hover:scale-110" data-val="4">★</span>
                        <span class="star-btn hover:scale-110" data-val="5">★</span>
                    </div>
                    <input type="hidden" id="selectedRating" required>
                </div>
                <textarea id="reviewText" required rows="2" placeholder="เขียนความประทับใจสั้นๆ..." class="w-full border border-gray-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-yellow-400"></textarea>
                <button type="submit" id="submitReviewBtn" class="w-full bg-yellow-400 text-yellow-900 font-bold py-2.5 rounded-lg hover:bg-yellow-500 transition shadow-sm">
                    ส่งรีวิว
                </button>
            </form>
        </div>
    </div>

    <!-- ส่วนแสดงแผนที่ -->
    <div id="map"></div>

    <!-- ส่วนการ์ดสไลด์แสดงข้อมูล -->
    <div id="places-slider" class="slider-container"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script type="module">
        // 🔴 นำเข้าคำสั่ง addDoc, query, orderBy สำหรับระบบรีวิว 🔴
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvXRATBf2x1Lq_JToL2rlQYOh8mK65tIU",
            authDomain: "suchartstudio-9a78d.firebaseapp.com",
            databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "suchartstudio-9a78d",
            storageBucket: "suchartstudio-9a78d.firebasestorage.app",
            messagingSenderId: "953369646185",
            appId: "1:953369646185:web:e51f0e821d4fba1e6ebef8",
            measurementId: "G-LVGDE7H8ZK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = L.map('map', { zoomControl: false }).setView([16.4322, 102.8236], 13);
        L.control.zoom({ position: 'topleft' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // --- ระบบจัดทริปนำทาง ---
        window.selectedPlaces = []; 
        window.toggleRoute = function(id, name, lat, lng) {
            const index = window.selectedPlaces.findIndex(p => p.id === id);
            const btn = document.getElementById(`btn-${id}`);
            if(index > -1) {
                window.selectedPlaces.splice(index, 1);
                if(btn) {
                    btn.innerHTML = "📍 ลงทริป";
                    btn.className = "flex-1 bg-blue-50 text-blue-600 border border-blue-200 py-2 rounded-lg text-sm font-bold hover:bg-blue-100 transition shadow-sm truncate";
                }
            } else {
                window.selectedPlaces.push({ id, name, lat, lng });
                if(btn) {
                    btn.innerHTML = "✅ เลือกแล้ว";
                    btn.className = "flex-1 bg-green-50 text-green-700 border border-green-300 py-2 rounded-lg text-sm font-bold hover:bg-green-100 transition shadow-sm truncate";
                }
            }
            window.updateRouteUI();
        }

        window.updateRouteUI = function() {
            document.getElementById('routeBadge').innerText = window.selectedPlaces.length;
            const list = document.getElementById('routeList');
            if(window.selectedPlaces.length === 0) {
                list.innerHTML = '<li class="text-gray-400 text-xs italic text-center py-2">ยังไม่ได้เลือกสถานที่</li>';
            } else {
                list.innerHTML = window.selectedPlaces.map((p, idx) => `
                    <li class="flex items-center gap-2 bg-gray-50 p-2 rounded-lg border border-gray-100">
                        <span class="bg-blue-100 text-blue-700 rounded-full min-w-[24px] h-6 flex items-center justify-center text-xs font-bold">${idx+1}</span> 
                        <span class="truncate text-gray-800 font-medium">${p.name}</span>
                    </li>`).join('');
            }
        }

        window.toggleRoutePanel = () => { document.getElementById('routePanel').classList.toggle('hidden'); document.getElementById('routePanel').classList.toggle('flex'); }
        
        window.clearRoute = function() {
            window.selectedPlaces = [];
            document.querySelectorAll('[id^="btn-"]').forEach(btn => {
                btn.innerHTML = "📍 ลงทริป";
                btn.className = "flex-1 bg-blue-50 text-blue-600 border border-blue-200 py-2 rounded-lg text-sm font-bold hover:bg-blue-100 transition shadow-sm truncate";
            });
            window.updateRouteUI();
            window.toggleRoutePanel(); 
        }

        window.startNavigation = function() {
            if(window.selectedPlaces.length === 0) return alert("กรุณาเลือกสถานที่อย่างน้อย 1 แห่งครับ");
            const coordsString = window.selectedPlaces.map(p => `${p.lat},${p.lng}`).join('/');
            window.open(`https://www.google.com/maps/dir/${coordsString}`, '_blank');
        }

        // --- 🟢 ระบบจัดการรีวิว (Review System) 🟢 ---
        
        // 1. ระบบคลิกเลือกดาว
        let currentRating = 0;
        const stars = document.querySelectorAll('.star-btn');
        stars.forEach(star => {
            star.addEventListener('click', function() {
                currentRating = parseInt(this.getAttribute('data-val'));
                document.getElementById('selectedRating').value = currentRating;
                stars.forEach(s => {
                    s.style.color = parseInt(s.getAttribute('data-val')) <= currentRating ? '#facc15' : '#d1d5db'; // สีเหลืองทอง / สีเทา
                });
            });
        });

        // 2. เปิดหน้าต่างรีวิว
        window.openReviewModal = async function(placeId, placeName) {
            document.getElementById('reviewPlaceId').value = placeId;
            document.getElementById('reviewPlaceName').innerText = placeName;
            document.getElementById('reviewModal').classList.remove('hidden');
            document.getElementById('reviewModal').classList.add('flex');
            
            // เคลียร์ฟอร์ม
            document.getElementById('reviewForm').reset();
            currentRating = 0;
            stars.forEach(s => s.style.color = '#d1d5db');
            
            await loadReviews(placeId);
        }

        window.closeReviewModal = function() {
            document.getElementById('reviewModal').classList.add('hidden');
            document.getElementById('reviewModal').classList.remove('flex');
        }

        // 3. ดึงข้อมูลรีวิวมาแสดง
        async function loadReviews(placeId) {
            const container = document.getElementById('reviewsContainer');
            container.innerHTML = '<div class="text-center text-gray-400 text-sm py-4">กำลังโหลดรีวิว...</div>';
            
            try {
                // ดึงจาก Subcollection "reviews" เรียงตามเวลาล่าสุด
                const q = query(collection(db, "places", placeId, "reviews"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="text-center text-gray-400 text-sm py-8 bg-white rounded-xl border border-dashed">ยังไม่มีรีวิวสำหรับที่นี่<br>มารีวิวเป็นคนแรกสิ! 😊</div>';
                    return;
                }
                
                container.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const rev = doc.data();
                    const starsHtml = '★'.repeat(rev.rating) + '☆'.repeat(5 - rev.rating);
                    
                    container.innerHTML += `
                        <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                            <div class="text-yellow-400 text-sm tracking-widest">${starsHtml}</div>
                            <p class="text-sm text-gray-700 mt-1">${rev.text}</p>
                            <div class="text-[10px] text-gray-400 mt-2 text-right">${new Date(rev.timestamp).toLocaleDateString('th-TH')}</div>
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = `<div class="text-center text-red-400 text-sm py-4">โหลดข้อมูลล้มเหลว<br>(${error.message})</div>`;
            }
        }

        // 4. บันทึกรีวิวใหม่
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rating = document.getElementById('selectedRating').value;
            const text = document.getElementById('reviewText').value;
            const placeId = document.getElementById('reviewPlaceId').value;
            const btn = document.getElementById('submitReviewBtn');
            
            if(!rating || rating == 0) return alert("กรุณาให้ดาวก่อนส่งรีวิวครับ");

            btn.disabled = true;
            btn.innerText = "กำลังส่ง...";

            try {
                await addDoc(collection(db, "places", placeId, "reviews"), {
                    rating: parseInt(rating),
                    text: text,
                    timestamp: Date.now()
                });
                
                // โหลดรีวิวใหม่และเคลียร์ฟอร์ม
                await loadReviews(placeId);
                document.getElementById('reviewForm').reset();
                currentRating = 0;
                stars.forEach(s => s.style.color = '#d1d5db');
                
            } catch (error) {
                alert("เกิดข้อผิดพลาด: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "ส่งรีวิว";
            }
        });

        // --- โหลดแผนที่และการ์ด ---
        async function loadPlaces() {
            try {
                const querySnapshot = await getDocs(collection(db, "places"));
                const slider = document.getElementById('places-slider');
                slider.innerHTML = '';

                querySnapshot.forEach((docSnapshot) => {
                    const id = docSnapshot.id;
                    const data = docSnapshot.data();
                    
                    const customIcon = L.divIcon({
                        className: '', 
                        html: `
                            <div style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid white; overflow: hidden; box-shadow: 0px 4px 6px rgba(0,0,0,0.3); background: white;">
                                <img src="${data.imageUrl}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://placehold.co/100x100?text=No+Img'">
                            </div>
                        `,
                        iconSize: [48, 48], iconAnchor: [24, 24], popupAnchor: [0, -30]
                    });

                    const marker = L.marker([data.lat, data.lng], { icon: customIcon }).addTo(map);
                    marker.bindPopup(`<div class="custom-text-outline" style="font-family: 'Chakra Petch', sans-serif; font-weight: bold;">${data.name}</div>`, { className: 'transparent-popup', closeButton: false });

                    const card = document.createElement('div');
                    card.className = 'card cursor-pointer';
                    // 🔴 ปรับเลย์เอาต์ปุ่มให้เป็น 2 ปุ่มเรียงคู่กัน 🔴
                    card.innerHTML = `
                        <img src="${data.imageUrl}" alt="${data.name}" onerror="this.onerror=null; this.src='https://placehold.co/400x200/eeeeee/999999?text=No+Image';">
                        <div class="p-3 md:p-4 flex-1 flex flex-col overflow-hidden">
                            <h3 class="text-base md:text-lg font-bold text-gray-800 leading-tight truncate">${data.name}</h3>
                            <p class="text-xs md:text-sm text-gray-600 mt-1 line-clamp-2">${data.descTh}</p>
                            
                            <div class="flex gap-2 mt-auto shrink-0 pt-2">
                                <button id="btn-${id}" onclick="event.stopPropagation(); window.toggleRoute('${id}', '${data.name}', ${data.lat}, ${data.lng})" class="flex-1 bg-blue-50 text-blue-600 border border-blue-200 py-2 rounded-lg text-sm font-bold hover:bg-blue-100 transition shadow-sm truncate">
                                    📍 ลงทริป
                                </button>
                                <button onclick="event.stopPropagation(); window.openReviewModal('${id}', '${data.name}')" class="flex-1 bg-yellow-50 text-yellow-600 border border-yellow-200 py-2 rounded-lg text-sm font-bold hover:bg-yellow-100 transition shadow-sm truncate">
                                    ⭐ รีวิว
                                </button>
                            </div>
                        </div>
                    `;
                    
                    card.addEventListener('click', () => {
                        map.flyTo([data.lat, data.lng], 16, { duration: 1.5 });
                        setTimeout(() => marker.openPopup(), 1500);
                    });

                    slider.appendChild(card);
                });
            } catch (error) {
                document.getElementById('places-slider').innerHTML = `<div class="w-full flex items-center justify-center text-red-500 font-bold">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
            }
        }

        loadPlaces();
    </script>
</body>
</html>
