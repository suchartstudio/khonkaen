<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ที่เที่ยวขอนแก่น Khon Kaen Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 60vh; width: 100%; z-index: 1; }
        .slider-container { 
            height: 40vh; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            display: flex; 
            padding: 1rem; 
            gap: 1rem; 
            background: #f3f4f6; 
        }
        .card { 
            min-width: 85%; 
            scroll-snap-align: center; 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) {
            .card { min-width: 300px; }
        }
        .card img { 
            height: 160px; 
            width: 100%; 
            object-fit: cover; 
            background-color: #e5e7eb;
        }
        .slider-container::-webkit-scrollbar { display: none; }
        .slider-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <div id="map"></div>

    <div id="places-slider" class="slider-container">
        <div class="w-full flex items-center justify-center text-gray-500">
            กำลังโหลดข้อมูลสถานที่...
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvXRATBf2x1Lq_JToL2rlQYOh8mK65tIU",
            authDomain: "suchartstudio-9a78d.firebaseapp.com",
            databaseURL: "https://suchartstudio-9a78d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "suchartstudio-9a78d",
            storageBucket: "suchartstudio-9a78d.firebasestorage.app",
            messagingSenderId: "953369646185",
            appId: "1:953369646185:web:e51f0e821d4fba1e6ebef8",
            measurementId: "G-LVGDE7H8ZK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = L.map('map').setView([16.4322, 102.8236], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        async function loadPlaces() {
            try {
                const querySnapshot = await getDocs(collection(db, "places"));
                const slider = document.getElementById('places-slider');
                
                slider.innerHTML = '';

                if (querySnapshot.empty) {
                    slider.innerHTML = '<div class="w-full flex items-center justify-center text-gray-500">ยังไม่มีข้อมูลสถานที่</div>';
                    return;
                }
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    const marker = L.marker([data.lat, data.lng]).addTo(map);
                    marker.bindPopup(`<b class="text-base">${data.name}</b>`);

                    const card = document.createElement('div');
                    card.className = 'card cursor-pointer';
                    // อัปเดต onerror ป้องกันวนลูป และเปลี่ยนแหล่งภาพสำรองใหม่
                    card.innerHTML = `
                        <img src="${data.imageUrl}" alt="${data.name}" onerror="this.onerror=null; this.src='https://placehold.co/400x200/eeeeee/999999?text=No+Image';">
                        <div class="p-4 flex-1 flex flex-col">
                            <h3 class="text-lg font-bold text-gray-800">${data.name}</h3>
                            <p class="text-sm text-gray-600 mt-2 line-clamp-2">${data.descTh}</p>
                            <p class="text-xs text-gray-400 mt-1 line-clamp-2 italic">${data.descEn || ''}</p>
                        </div>
                    `;
                    
                    card.addEventListener('click', () => {
                        map.flyTo([data.lat, data.lng], 16, { duration: 1.5 });
                        setTimeout(() => marker.openPopup(), 1500);
                    });

                    slider.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading places:", error);
                document.getElementById('places-slider').innerHTML = 
                    `<div class="w-full flex items-center justify-center text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
            }
        }

        loadPlaces();
    </script>
</body>
</html>
